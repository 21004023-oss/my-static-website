<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - phanngoquocbao.id.vn</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#070d17; --bg-2:#0f172a; --card:rgba(17,24,39,0.92); --line:rgba(148,163,184,0.18); --text:#f8fafc; --muted:#94a3b8; --primary:#38bdf8; --accent:#34d399; --danger:#fb7185; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; }
    body { min-height:100vh; background:radial-gradient(circle at top left,rgba(56,189,248,0.12),transparent 22%),radial-gradient(circle at bottom right,rgba(52,211,153,0.12),transparent 22%),linear-gradient(135deg,var(--bg) 0%,#0b1220 100%); color:var(--text); padding:24px 16px; }
    .input,.select { width:100%; background:rgba(15,23,42,0.8); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:10px 12px; font-size:0.92rem; outline:none; }
    .input:focus { border-color:rgba(56,189,248,0.7); box-shadow:0 0 0 4px rgba(56,189,248,0.1); }
    .btn { border:none; border-radius:10px; padding:10px 14px; font-weight:800; cursor:pointer; }
    .btn-primary { background:linear-gradient(135deg,var(--primary),#0ea5e9); color:#031827; }
    .btn-accent { background:linear-gradient(135deg,var(--accent),#10b981); color:#03150e; }
    .btn-danger { background:linear-gradient(135deg,var(--danger),#f43f5e); color:white; }
    .container { max-width:1200px; margin:0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px; }
    h1 { font-size:clamp(1.5rem,2vw,2rem); font-weight:800; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px; }
    .stat-title { color:var(--muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; }
    .stat-value { font-size:clamp(1.2rem,2vw,1.7rem); font-weight:800; }
    .main-grid { display:grid; grid-template-columns:340px 1fr; gap:24px; }
    @media (max-width:960px){ .main-grid{grid-template-columns:1fr;} }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 18px; }
    .card h3 { margin-bottom:16px; font-size:1.12rem; }
    .form-group { margin-bottom:14px; }
    label { display:block; margin-bottom:7px; color:#dbeafe; font-size:0.82rem; font-weight:700; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem; }
    th,td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; }
    .profit-col { color:var(--accent); font-weight:800; }
    .danger-link { background:transparent; border:none; color:var(--danger); font-weight:800; cursor:pointer; }
    .small-btn { padding:8px 10px; font-size:0.8rem; }
    .toast { position:fixed; right:20px; bottom:20px; background:rgba(15,23,42,0.96); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:12px; opacity:0; transform:translateY(8px); transition:0.25s ease; z-index:200; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  <div class="container" id="adminApp">
    <header>
      <h1>Bảng Điều Khiển Quản Trị Kho &amp; Giá Vốn</h1>
      <div class="actions">
        <button class="btn btn-accent" id="exportBtn">📥 Tải JSON</button>
        <button class="btn btn-primary" id="addAppBtn">📱 Thêm App</button>
        <button class="btn btn-danger" id="logoutBtn">🔒 Đăng xuất</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-title">Tổng gói tồn kho</div><div class="stat-value" id="stItems">0</div></div>
      <div class="stat-card"><div class="stat-title">Tổng vốn tồn kho</div><div class="stat-value" id="stCost">0 đ</div></div>
      <div class="stat-card"><div class="stat-title">Doanh thu kỳ vọng</div><div class="stat-value" id="stRev" style="color:var(--primary);">0 đ</div></div>
      <div class="stat-card"><div class="stat-title">Lợi nhuận dự kiến</div><div class="stat-value" id="stProfit" style="color:var(--accent);">0 đ</div></div>
    </div>

    <div class="main-grid">
      <div class="card">
        <h3>Thêm / Cập Nhật Gói Cước</h3>
        <form id="addForm">
          <div class="form-group"><label>Ứng dụng</label><select id="pAppKey" class="input"></select></div>
          <div class="form-group"><label>Tên gói</label><input type="text" id="pName" class="input" placeholder="Ví dụ: YouTube Premium 1 Tháng" required maxlength="120" /></div>
          <div class="form-group"><label>Giá vốn nhập (VNĐ)</label><input type="number" id="pCost" class="input" placeholder="15000" min="0" max="1000000000" required /></div>
          <div class="form-group"><label>Giá bán niêm yết (VNĐ)</label><input type="number" id="pPrice" class="input" placeholder="35000" min="0" max="1000000000" required /></div>
          <div class="form-group"><label>Số lượng tồn kho</label><input type="number" id="pStock" class="input" placeholder="50" min="0" max="1000000" required /></div>
          <div class="form-group"><label>Mô tả gói</label><input type="text" id="pDesc" class="input" placeholder="Bảo hành full thời hạn" maxlength="200" /></div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="saveBtn">Lưu Gói</button>
          <button type="button" class="btn" id="cancelEditBtn" style="width:100%;margin-top:8px;display:none;background:transparent;border:1px solid var(--line);color:var(--muted);">Hủy sửa</button>
        </form>
      </div>

      <div class="card">
        <h3>Chi Tiết Giá Vốn &amp; Lợi Nhuận</h3>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Ứng dụng</th><th>Tên gói</th><th>Giá vốn</th><th>Giá bán</th><th>Lãi / đơn</th><th>Kho</th><th>Thao tác</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let data = {};
    let editAppKey = '';
    let editIndex = -1;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'same-origin' });
        const d = await res.json();
        if (!d.isAdmin) window.location.href = '/admin';
      } catch (e) {
        window.location.href = '/admin';
      }
    }

    async function loadAdminData() {
      try {
        const res = await fetch('/api/services', { credentials: 'same-origin', cache: 'no-store' });
        if (res.status === 401) { window.location.href = '/admin'; return; }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      } catch (error) {
        data = {};
        showToast('Không tải được dữ liệu từ server.');
      }
      renderAdmin();
    }

    async function saveToServer() {
      const res = await fetch('/api/services', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(data)
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || !d.success) throw new Error(d.message || ('HTTP ' + res.status));
    }

    function renderAdmin() {
      const select = document.getElementById('pAppKey');
      const keys = Object.keys(data);
      if (!keys.length) {
        select.innerHTML = '<option value="">Chưa có app nào</option>';
        document.getElementById('tableBody').innerHTML = '';
        return;
      }
      select.innerHTML = keys.map(k => `<option value="${esc(k)}">${esc(data[k].name)}</option>`).join('');
      if (keys.indexOf(select.value) === -1) select.value = keys[0];

      let totalItems = 0, totalCost = 0, totalRev = 0, rows = '';
      keys.forEach(appKey => {
        const app = data[appKey];
        (app.plans || []).forEach((plan, idx) => {
          const profit = Number(plan.price || 0) - Number(plan.cost || 0);
          totalItems += Number(plan.stock || 0);
          totalCost += Number(plan.cost || 0) * Number(plan.stock || 0);
          totalRev += Number(plan.price || 0) * Number(plan.stock || 0);
          rows += `<tr>
            <td><strong>${esc(app.name)}</strong></td>
            <td>${esc(plan.name)}</td>
            <td>${Number(plan.cost || 0).toLocaleString('vi-VN')} đ</td>
            <td>${Number(plan.price || 0).toLocaleString('vi-VN')} đ</td>
            <td class="profit-col">${profit.toLocaleString('vi-VN')} đ</td>
            <td>${esc(String(plan.stock))}</td>
            <td>
              <button class="btn btn-primary small-btn" type="button" data-app="${esc(appKey)}" data-idx="${idx}" data-act="edit">Sửa</button>
              <button class="danger-link" type="button" data-app="${esc(appKey)}" data-idx="${idx}" data-act="del">Xóa</button>
            </td>
          </tr>`;
        });
      });
      document.getElementById('tableBody').innerHTML = rows || '<tr><td colspan="7" style="color:var(--muted);">Chưa có gói nào.</td></tr>';
      document.getElementById('stItems').textContent = totalItems;
      document.getElementById('stCost').textContent = `${totalCost.toLocaleString('vi-VN')} đ`;
      document.getElementById('stRev').textContent = `${totalRev.toLocaleString('vi-VN')} đ`;
      document.getElementById('stProfit').textContent = `${(totalRev - totalCost).toLocaleString('vi-VN')} đ`;
    }

    document.getElementById('tableBody').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const appKey = btn.getAttribute('data-app');
      const idx = Number(btn.getAttribute('data-idx'));
      if (btn.getAttribute('data-act') === 'edit') editPlan(appKey, idx);
      else removePlan(appKey, idx);
    });

    function resetForm() {
      document.getElementById('addForm').reset();
      editAppKey = '';
      editIndex = -1;
      document.getElementById('cancelEditBtn').style.display = 'none';
      document.getElementById('saveBtn').textContent = 'Lưu Gói';
      const firstApp = Object.keys(data)[0];
      if (firstApp) document.getElementById('pAppKey').value = firstApp;
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const appKey = document.getElementById('pAppKey').value;
      const name = document.getElementById('pName').value.trim();
      const cost = Number(document.getElementById('pCost').value || 0);
      const price = Number(document.getElementById('pPrice').value || 0);
      const stock = Number(document.getElementById('pStock').value || 0);
      const desc = document.getElementById('pDesc').value.trim() || 'Bảo hành full thời hạn';
      if (!appKey || !name) { alert('Vui lòng chọn ứng dụng và nhập tên gói.'); return; }
      if (!data[appKey]) { alert('App không tồn tại.'); return; }
      if (cost < 0 || price < 0 || stock < 0) { alert('Giá và tồn kho phải >= 0.'); return; }

      // FIX: khi đang sửa thì giữ nguyên app gốc + id gốc, không cho nhảy app
      if (editIndex >= 0 && editAppKey) {
        const old = data[editAppKey].plans[editIndex] || {};
        data[editAppKey].plans[editIndex] = { id: old.id || String(Date.now()), name, desc, cost, price, stock };
      } else {
        data[appKey].plans.push({ id: String(Date.now()), name, desc, cost, price, stock });
      }
      try {
        await saveToServer();
        resetForm();
        renderAdmin();
        showToast('Đã lưu lên server.');
      } catch (err) {
        showToast('Lưu thất bại: ' + err.message);
      }
    });

    function editPlan(appKey, index) {
      const plan = (data[appKey] || {}).plans?.[index];
      if (!plan) return;
      editAppKey = appKey;
      editIndex = index;
      document.getElementById('pAppKey').value = appKey;
      document.getElementById('pAppKey').disabled = true;
      document.getElementById('pName').value = plan.name || '';
      document.getElementById('pCost').value = plan.cost || 0;
      document.getElementById('pPrice').value = plan.price || 0;
      document.getElementById('pStock').value = plan.stock || 0;
      document.getElementById('pDesc').value = plan.desc || '';
      document.getElementById('saveBtn').textContent = 'Cập nhật gói';
      document.getElementById('cancelEditBtn').style.display = 'block';
      showToast('Đã tải dữ liệu gói để chỉnh sửa');
    }

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      document.getElementById('pAppKey').disabled = false;
      resetForm();
    });

    async function removePlan(appKey, index) {
      if (!confirm('Bạn có chắc muốn xóa gói này?')) return;
      data[appKey].plans.splice(index, 1);
      try {
        await saveToServer();
        renderAdmin();
        showToast('Đã xóa gói');
      } catch (err) {
        showToast('Xóa thất bại: ' + err.message);
        loadAdminData();
      }
    }

    document.getElementById('addAppBtn').addEventListener('click', async () => {
      const key = (prompt('Nhập mã app (viết liền, ví dụ: spotify):') || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!key) return;
      const name = (prompt('Nhập tên hiển thị (ví dụ: Spotify Premium):') || '').trim().slice(0, 80);
      if (!name) return;
      const icon = (prompt('Nhập emoji/icon (ví dụ: 🎵):', '📦') || '📦').slice(0, 8);
      if (data[key]) { alert('Mã app này đã tồn tại.'); return; }
      data[key] = { name, icon, plans: [] };
      try {
        await saveToServer();
        renderAdmin();
        showToast('Đã thêm app mới');
      } catch (err) {
        delete data[key];
        showToast('Thêm thất bại: ' + err.message);
      }
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'services.json';
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('Đã tải file services.json (bản backup). Dữ liệu chính đã lưu trên server.');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
      window.location.href = '/admin';
    });

    window.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      await loadAdminData();
    });
  </script>
</body>
</html>
