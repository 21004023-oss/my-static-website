<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Giá Dịch Vụ Số - Bản Quyền Chính Hãng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Topbar mở rộng tối đa */
    .topbar {
      background: #0f172a;
      color: #fff;
      padding: 18px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .brand h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand p {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 3px;
    }
    .brand p b { color: #34d399; }

    .search-box {
      flex: 1;
      max-width: 460px;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 13.5px;
      outline: none;
      transition: all 0.25s ease;
    }
    .search-box input:focus {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
    }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
    }

    /* Layout 3 cột bung rộng, cân đối */
    .layout {
      max-width: 1600px;
      margin: 24px auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 420px;
      gap: 24px;
      align-items: start;
    }

    /* CỘT 1: Danh mục */
    .col-cats {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px 12px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 92px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .col-cats h2 {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0 8px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
      font-weight: 700;
    }
    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.2s ease;
      text-align: left;
    }
    .cat-item:hover {
      background: #f1f5f9;
      transform: translateX(3px);
    }
    .cat-item.active {
      background: #0f172a;
      color: #fff;
    }
    .cat-item .left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .cat-item img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .cat-item .badge-count {
      font-size: 11px;
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 99px;
    }
    .cat-item.active .badge-count {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* CỘT 2: Danh sách sản phẩm rộng rãi */
    .col-products {
      min-width: 0;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .section-header h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }
    .section-header span {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .plan-card:hover {
      border-color: #94a3b8;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .plan-card.selected {
      border-color: var(--primary);
      background: #fcfdfd;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }
    .plan-card .p-left {
      flex: 1;
      min-width: 0;
    }
    .plan-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }
    .plan-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .tag {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #475569;
    }
    .tag.in-stock {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #a7f3d0;
    }
    .tag.out-stock {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .plan-card .p-right {
      text-align: right;
      flex-shrink: 0;
    }
    .plan-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .view-btn {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .plan-card.selected .view-btn {
      color: var(--primary-dark);
    }

    /* CỘT 3: Chi tiết mô tả rộng rãi, căn lề chuẩn */
    .col-detail {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 92px;
    }
    .detail-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.4;
    }
    .detail-price-box {
      margin: 14px 0 18px;
      padding: 14px 18px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .detail-price-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .detail-stock-badge {
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .detail-stock-badge.in-stock {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .detail-stock-badge.out-stock {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    /* Khung Mô Tả Sản Phẩm */
    .desc-wrapper {
      margin-bottom: 20px;
    }
    .desc-label {
      font-size: 12.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #3b82f6;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .desc-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.75;
      color: #334155;
      white-space: pre-line;
      word-break: break-word;
      max-height: 420px;
      overflow-y: auto;
    }

    .spec-list {
      margin-bottom: 22px;
      font-size: 13px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .spec-row span:first-child { color: var(--text-muted); }
    .spec-row span:last-child { font-weight: 600; color: var(--text-main); }

    .btn-buy-zalo {
      display: block;
      width: 100%;
      background: var(--primary-dark);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
      transition: all 0.2s ease;
    }
    .btn-buy-zalo:hover {
      background: #047857;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
    }

    /* Responsive cho màn hình nhỏ */
    @media(max-width: 1200px) {
      .layout {
        grid-template-columns: 240px 1fr;
      }
      .col-detail {
        grid-column: 1 / -1;
        position: static;
      }
    }

    @media(max-width: 768px) {
      .topbar { padding: 14px 16px; }
      .layout {
        grid-template-columns: 1fr;
        padding: 0 14px 40px;
        margin: 14px auto;
        gap: 16px;
      }
      .col-cats {
        position: static;
        max-height: none;
        display: flex;
        overflow-x: auto;
        padding: 8px;
        gap: 8px;
      }
      .col-cats h2 { display: none; }
      .cat-item {
        white-space: nowrap;
        width: auto;
        padding: 8px 14px;
        border-radius: 99px;
        background: #f1f5f9;
      }
      .cat-item:hover { transform: none; }
      .cat-item .badge-count { display: none; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-content">
    <div class="brand">
      <h1>⚡ BẢNG GIÁ DỊCH VỤ SỐ</h1>
     
    </div>
    <div class="search-box">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input id="searchInp" placeholder="Tìm nhanh dịch vụ (YouTube, ChatGPT, Canva, Veo...)" autocomplete="off" />
    </div>
  </div>
</header>

<main class="layout">
  <!-- CỘT 1: DANH MỤC -->
  <aside class="col-cats">
    <h2>Danh mục dịch vụ</h2>
    <div id="catsContainer"></div>
  </aside>

  <!-- CỘT 2: DANH SÁCH SẢN PHẨM -->
  <section class="col-products">
    <div class="section-header">
      <h2 id="currentCatTitle">...</h2>
      <span id="currentCatCount">0 gói</span>
    </div>
    <div id="plansContainer"></div>
  </section>

  <!-- CỘT 3: MÔ TẢ CHI TIẾT SẢN PHẨM -->
  <aside class="col-detail" id="detailPanel">
    <div id="detailContent">
      <div style="color:var(--text-muted); text-align:center; padding:50px 0; font-size:14px;">
        Chọn một sản phẩm để xem mô tả chi tiết & đặt mua
      </div>
    </div>
  </aside>
</main>

<script>
var ZALO = '0373996379';
var D = {}, curCat = '', selPlan = null, kw = '';

var LOGO = {
  'youtube': 'https://www.google.com/s2/favicons?domain=youtube.com&sz=64',
  'chatgpt': 'https://www.google.com/s2/favicons?domain=openai.com&sz=64',
  'google-veo': 'https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64',
  'canva': 'https://www.google.com/s2/favicons?domain=canva.com&sz=64',
  'capcut': 'https://www.google.com/s2/favicons?domain=capcut.com&sz=64',
  'api-claude-codex': 'https://www.google.com/s2/favicons?domain=anthropic.com&sz=64',
  'api-cursor-deepseek': 'https://www.google.com/s2/favicons?domain=deepseek.com&sz=64',
  'grok': 'https://www.google.com/s2/favicons?domain=x.ai&sz=64',
  'spotify': 'https://www.google.com/s2/favicons?domain=spotify.com&sz=64',
  'notion': 'https://www.google.com/s2/favicons?domain=notion.so&sz=64',
  'kling': 'https://www.google.com/s2/favicons?domain=klingai.com&sz=64',
  'gmail': 'https://www.google.com/s2/favicons?domain=gmail.com&sz=64'
};

function money(n) {
  n = Number(n || 0);
  return n === 0 ? 'Liên hệ' : n.toLocaleString('vi-VN') + 'đ';
}

function getStockInfo(p) {
  var s = p.stock;
  if (s === -1 || s === '∞' || s === '-1') {
    return { tag: 'Còn hàng (∞)', isOut: false, badgeText: '✓ Sẵn hàng kích hoạt (∞)' };
  }
  var num = Number(s || 0);
  if (num > 0) {
    return { tag: 'Còn ' + num, isOut: false, badgeText: '✓ Còn ' + num + ' tài khoản' };
  }
  return { tag: 'Tạm hết', isOut: true, badgeText: '⚠ Tạm hết hàng' };
}

function loadData() {
  fetch('./data/services.json?t=' + new Date().getTime(), { cache: 'no-store' })
    .then(r => r.json())
    .then(data => {
      D = data || {};
      var keys = Object.keys(D);
      if (keys.length) {
        curCat = keys[0];
        if (D[curCat].plans && D[curCat].plans.length) {
          selPlan = D[curCat].plans[0];
        }
      }
      render();
    })
    .catch(() => {
      document.getElementById('plansContainer').innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;font-size:14px;">Chưa tải được dữ liệu data/services.json. Vui lòng kiểm tra lại file!</div>';
    });
}

function render() {
  renderCategories();
  renderPlans();
  renderDetail();
}

function renderCategories() {
  var c = document.getElementById('catsContainer');
  c.innerHTML = '';
  Object.keys(D).forEach(k => {
    var it = D[k];
    var btn = document.createElement('button');
    btn.className = 'cat-item' + (k === curCat && !kw ? ' active' : '');
    var logoUrl = it.logo || LOGO[k] || '';
    
    var imgHtml = logoUrl 
      ? `<img src="${logoUrl}" onerror="this.style.display='none'" />` 
      : `<span style="font-size:12px;width:20px;text-align:center">❖</span>`;

    btn.innerHTML = `
      <div class="left">${imgHtml}<span>${it.name}</span></div>
      <span class="badge-count">${(it.plans || []).length}</span>
    `;

    btn.onclick = () => {
      kw = '';
      document.getElementById('searchInp').value = '';
      curCat = k;
      if (D[k].plans && D[k].plans.length) selPlan = D[k].plans[0];
      render();
    };
    c.appendChild(btn);
  });
}

function renderPlans() {
  var container = document.getElementById('plansContainer');
  container.innerHTML = '';

  if (kw) {
    var found = [];
    Object.keys(D).forEach(k => {
      (D[k].plans || []).forEach(p => {
        var str = ((p.name || '') + ' ' + (p.detail || '') + ' ' + (p.source || '')).toLowerCase();
        if (str.indexOf(kw) !== -1) found.push({ catName: D[k].name, plan: p });
      });
    });

    document.getElementById('currentCatTitle').textContent = `Kết quả tìm kiếm: "${kw}"`;
    document.getElementById('currentCatCount').textContent = `${found.length} gói`;

    if (!found.length) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">Không tìm thấy gói nào phù hợp.</div>';
      return;
    }

    found.forEach(item => {
      container.appendChild(createPlanCard(item.catName, item.plan));
    });
    return;
  }

  var cat = D[curCat];
  if (!cat) return;

  document.getElementById('currentCatTitle').textContent = cat.name;
  var plans = cat.plans || [];
  document.getElementById('currentCatCount').textContent = `${plans.length} gói`;

  if (!plans.length) {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">Danh mục này hiện chưa có gói nào.</div>';
    return;
  }

  plans.forEach(p => {
    container.appendChild(createPlanCard(cat.name, p));
  });
}

function createPlanCard(catName, p) {
  var card = document.createElement('div');
  var isSelected = selPlan && selPlan.id === p.id;
  card.className = 'plan-card' + (isSelected ? ' selected' : '');

  var stock = getStockInfo(p);
  var stockHtml = `<span class="tag ${stock.isOut ? 'out-stock' : 'in-stock'}">${stock.tag}</span>`;

  card.innerHTML = `
    <div class="p-left">
      <div class="plan-title">${p.name}</div>
      <div class="plan-sub">
        ${p.duration ? `<span class="tag">${p.duration}</span>` : ''}
        ${p.source ? `<span class="tag">${p.source}</span>` : ''}
        ${stockHtml}
      </div>
    </div>
    <div class="p-right">
      <div class="plan-price">${money(p.price)}</div>
      <div class="view-btn">Chi tiết ➔</div>
    </div>
  `;

  card.onclick = () => {
    selPlan = p;
    document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    renderDetail(catName);
    
    if (window.innerWidth <= 1200) {
      document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
    }
  };

  return card;
}

function renderDetail(catName) {
  var panel = document.getElementById('detailContent');
  if (!selPlan) return;

  catName = catName || (D[curCat] ? D[curCat].name : '');
  var p = selPlan;
  var stock = getStockInfo(p);
  var zaloMsg = encodeURIComponent(`Chào shop, mình muốn mua gói [${catName}] ${p.name} giá ${money(p.price)}. Còn hàng không shop?`);

  panel.innerHTML = `
    <div class="detail-title">${p.name}</div>
    
    <div class="detail-price-box">
      <div>
        <span style="font-size:12px;color:var(--text-muted);display:block">Giá dịch vụ</span>
        <div class="detail-price-val">${money(p.price)}</div>
      </div>
      <div class="detail-stock-badge ${stock.isOut ? 'out-stock' : 'in-stock'}">${stock.badgeText}</div>
    </div>

    <div class="desc-wrapper">
      <div class="desc-label">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Mô tả chi tiết sản phẩm
      </div>
      <div class="desc-box">${p.detail || 'Sản phẩm đang được cập nhật thông tin mô tả chi tiết.'}</div>
    </div>

    <div class="spec-list">
      <div class="spec-row"><span>Danh mục:</span><span>${catName}</span></div>
      <div class="spec-row"><span>Thời hạn:</span><span>${p.duration || 'Theo gói'}</span></div>
      <div class="spec-row"><span>Hình thức:</span><span>${p.source || 'Chính chủ'}</span></div>
    </div>

    <a href="https://zalo.me/${ZALO}?text=${zaloMsg}" target="_blank" rel="noreferrer" class="btn-buy-zalo">
      Đặt Mua Qua Zalo (${money(p.price)})
    </a>
  `;
}

document.getElementById('searchInp').addEventListener('input', function(e) {
  kw = e.target.value.trim().toLowerCase();
  renderPlans();
});

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
