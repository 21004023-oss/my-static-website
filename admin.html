<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Quản Trị Dịch Vụ - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #111827;
      --card-border: #1f2937;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --green: #10b981;
      --red: #ef4444;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    
    .admin-header {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .admin-title h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .admin-title p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: #059669; color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-outline { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-outline:hover { background: #334155; color: #fff; }

    .main-wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 24px; }
    @media(max-width: 900px){ .main-wrap { grid-template-columns: 1fr; } }

    /* Category sidebar */
    .sidebar { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; height: fit-content; }
    .cat-item {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
      transition: 0.2s;
    }
    .cat-item:hover { background: #1e293b; }
    .cat-item.active { background: var(--primary); color: #fff; font-weight: 600; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.15); }

    /* Content */
    .content-area { display: flex; flex-direction: column; gap: 16px; }
    .content-top { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .content-top h2 { font-size: 18px; font-weight: 700; }

    .plan-table-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    th { background: #0f172a; padding: 14px 16px; color: var(--text-muted); font-size: 12.5px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--card-border); }
    td { padding: 14px 16px; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
    tr:hover td { background: #182234; }
    .plan-title { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .plan-sub { font-size: 12px; color: var(--text-muted); max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Modal Form */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-box {
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-box h3 { font-size: 18px; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    .form-group input, .form-group textarea, .form-group select {
      background: #0b0f17;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="admin-header">
    <div class="admin-title">
      <h1>⚙️ BẢNG QUẢN TRỊ DỊCH VỤ SỐ</h1>
      <p>Quản lý bảng giá, tồn kho và mô tả dịch vụ cho website</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="copyJSON()">📋 Sao chép JSON</button>
      <button class="btn btn-success" onclick="downloadJSON()">💾 Tải file services.json</button>
      <a href="index.html" class="btn btn-outline">👁️ Xem trang bán hàng</a>
    </div>
  </div>

  <div class="main-wrap">
    <!-- Cột danh mục -->
    <div class="sidebar">
      <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px;">
        Danh mục dịch vụ
      </div>
      <div id="catList"></div>
    </div>

    <!-- Cột bảng sản phẩm -->
    <div class="content-area">
      <div class="content-top">
        <h2 id="currentCategoryTitle">Danh sách sản phẩm</h2>
        <button class="btn btn-primary" onclick="openAddModal()">➕ Thêm gói mới</button>
      </div>

      <div class="plan-table-card">
        <table>
          <thead>
            <tr>
              <th>Tên gói sản phẩm</th>
              <th>Giá bán</th>
              <th>Tồn kho</th>
              <th>Thời hạn</th>
              <th style="text-align: right;">Thao tác</th>
            </tr>
          </thead>
          <tbody id="plansTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Chỉnh sửa / Thêm gói -->
  <div class="modal-overlay" id="planModal">
    <div class="modal-box">
      <h3 id="modalTitle">Chỉnh sửa gói dịch vụ</h3>
      
      <div class="form-group">
        <label>Tên gói dịch vụ:</label>
        <input type="text" id="inpName" placeholder="Ví dụ: Slot YouTube Premium 6 Tháng BHF">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Giá bán (VNĐ):</label>
          <input type="number" id="inpPrice" placeholder="180000">
        </div>
        <div class="form-group">
          <label>Thời hạn:</label>
          <input type="text" id="inpDuration" placeholder="6 Tháng / 1 Năm / Vĩnh viễn">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Loại tồn kho:</label>
          <select id="inpStockType" onchange="toggleStockInput()">
            <option value="-1">Vô cực (∞) - Luôn sẵn hàng</option>
            <option value="num">Số lượng cụ thể</option>
            <option value="0">Tạm hết hàng</option>
          </select>
        </div>
        <div class="form-group" id="stockNumberWrap" style="display: none;">
          <label>Nhập số lượng kho:</label>
          <input type="number" id="inpStockNumber" value="10">
        </div>
      </div>

      <div class="form-group">
        <label>Mô tả chi tiết (tự động căn lề từng dòng):</label>
        <textarea id="inpDetail" rows="6" placeholder="• Nhập từng gạch đầu dòng mô tả...&#10;• Quy tắc bảo hành..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
        <button class="btn btn-primary" onclick="savePlan()">Lưu thay đổi</button>
      </div>
    </div>
  </div>

  <script>
    let servicesData = {};
    let activeCat = '';
    let editingPlanIndex = -1;

    async function init() {
      try {
        const res = await fetch(`data/services.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Chưa tải được file services.json");
        servicesData = await res.json();
        const cats = Object.keys(servicesData);
        if (cats.length > 0) {
          activeCat = cats[0];
          renderCategories();
          renderTable();
        }
      } catch (e) {
        alert("Lưu ý: " + e.message);
      }
    }

    function renderCategories() {
      const el = document.getElementById('catList');
      el.innerHTML = Object.entries(servicesData).map(([k, cat]) => `
        <div class="cat-item ${k === activeCat ? 'active' : ''}" onclick="changeCat('${k}')">
          <span>${cat.name}</span>
          <span class="badge">${cat.plans.length}</span>
        </div>
      `).join('');
    }

    function changeCat(k) {
      activeCat = k;
      renderCategories();
      renderTable();
    }

    function renderTable() {
      const currentCat = servicesData[activeCat];
      document.getElementById('currentCategoryTitle').innerText = `${currentCat.name} (${currentCat.plans.length} gói)`;
      
      const tbody = document.getElementById('plansTableBody');
      if (currentCat.plans.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">Chưa có sản phẩm nào.</td></tr>`;
        return;
      }

      tbody.innerHTML = currentCat.plans.map((p, idx) => {
        const stockDisplay = p.stock === -1 ? '<span style="color:#60a5fa;">Vô cực (∞)</span>' : (p.stock === 0 ? '<span style="color:#ef4444;">Hết hàng</span>' : `Còn ${p.stock}`);
        return `
          <tr>
            <td>
              <div class="plan-title">${p.name}</div>
              <div class="plan-sub">${p.detail || 'Không có mô tả'}</div>
            </td>
            <td style="color:#34d399; font-weight:700;">${Number(p.price).toLocaleString('vi-VN')}đ</td>
            <td>${stockDisplay}</td>
            <td>${p.duration || 'N/A'}</td>
            <td style="text-align: right;">
              <button class="btn btn-outline" style="padding: 6px 10px; font-size:12px;" onclick="openEditModal(${idx})">✏️ Sửa</button>
              <button class="btn btn-danger" style="padding: 6px 10px; font-size:12px;" onclick="deletePlan(${idx})">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleStockInput() {
      const type = document.getElementById('inpStockType').value;
      document.getElementById('stockNumberWrap').style.display = type === 'num' ? 'flex' : 'none';
    }

    function openAddModal() {
      editingPlanIndex = -1;
      document.getElementById('modalTitle').innerText = `Thêm gói mới vào ${servicesData[activeCat].name}`;
      document.getElementById('inpName').value = '';
      document.getElementById('inpPrice').value = '';
      document.getElementById('inpDuration').value = '1 Tháng';
      document.getElementById('inpStockType').value = '-1';
      document.getElementById('inpDetail').value = '• Mô tả gói dịch vụ...\n• Quy định bảo hành...';
      toggleStockInput();
      document.getElementById('planModal').style.display = 'flex';
    }

    function openEditModal(idx) {
      editingPlanIndex = idx;
      const p = servicesData[activeCat].plans[idx];
      document.getElementById('modalTitle').innerText = `Chỉnh sửa gói: ${p.name}`;
      document.getElementById('inpName').value = p.name;
      document.getElementById('inpPrice').value = p.price;
      document.getElementById('inpDuration').value = p.duration || '1 Tháng';
      
      if (p.stock === -1) {
        document.getElementById('inpStockType').value = '-1';
      } else if (p.stock === 0) {
        document.getElementById('inpStockType').value = '0';
      } else {
        document.getElementById('inpStockType').value = 'num';
        document.getElementById('inpStockNumber').value = p.stock;
      }

      document.getElementById('inpDetail').value = p.detail || '';
      toggleStockInput();
      document.getElementById('planModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('planModal').style.display = 'none';
    }

    function savePlan() {
      const name = document.getElementById('inpName').value.trim();
      const price = Number(document.getElementById('inpPrice').value) || 0;
      const duration = document.getElementById('inpDuration').value.trim();
      const detail = document.getElementById('inpDetail').value.trim();
      const stockType = document.getElementById('inpStockType').value;

      if (!name) { alert("Vui lòng nhập tên gói!"); return; }

      let stock = -1;
      let stock_text = "Vô cực (∞)";
      if (stockType === '0') {
        stock = 0;
        stock_text = "Tạm hết hàng";
      } else if (stockType === 'num') {
        stock = Number(document.getElementById('inpStockNumber').value) || 0;
        stock_text = `Còn ${stock}`;
      }

      const planObj = {
        id: editingPlanIndex >= 0 ? servicesData[activeCat].plans[editingPlanIndex].id : 'p-' + Date.now(),
        name,
        price,
        stock,
        stock_text,
        duration,
        detail
      };

      if (editingPlanIndex >= 0) {
        servicesData[activeCat].plans[editingPlanIndex] = planObj;
      } else {
        servicesData[activeCat].plans.push(planObj);
      }

      closeModal();
      renderCategories();
      renderTable();
    }

    function deletePlan(idx) {
      if (confirm(`Bạn chắc chắn muốn xóa gói "${servicesData[activeCat].plans[idx].name}"?`)) {
        servicesData[activeCat].plans.splice(idx, 1);
        renderCategories();
        renderTable();
      }
    }

    function copyJSON() {
      const str = JSON.stringify(servicesData, null, 2);
      navigator.clipboard.writeText(str).then(() => {
        alert("✅ Đã sao chép toàn bộ JSON vào Clipboard! Giờ bạn chỉ cần mở file services.json trên GitHub và dán đè vào là xong.");
      });
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify(servicesData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "services.json";
      a.click();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
