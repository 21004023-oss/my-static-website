<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Giá Dịch Vụ Số - phanngoquocbao.id.vn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#070d17; --bg-2:#111827; --card:rgba(17,24,39,0.82); --line:rgba(148,163,184,0.18); --text:#f8fafc; --muted:#94a3b8; --primary:#38bdf8; --primary-2:#0ea5e9; --accent:#34d399; --danger:#fb7185; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; background:radial-gradient(circle at top left,rgba(56,189,248,0.18),transparent 28%),radial-gradient(circle at bottom right,rgba(52,211,153,0.14),transparent 22%),linear-gradient(135deg,var(--bg) 0%,#0b1220 100%); color:var(--text); padding:28px 16px; overflow-x:hidden; }
    .lock-overlay { position:fixed; inset:0; background:rgba(2,6,23,0.8); backdrop-filter:blur(14px); display:flex; align-items:center; justify-content:center; z-index:999; padding:18px; }
    .lock-box { width:min(100%,420px); padding:32px 26px; background:rgba(15,23,42,0.9); border:1px solid var(--line); border-radius:22px; box-shadow:0 24px 60px rgba(2,6,23,0.6); }
    .lock-icon { width:62px; height:62px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(56,189,248,0.12); color:var(--primary); }
    .pass-input { width:100%; margin-bottom:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(15,23,42,0.8); color:var(--text); font-size:1rem; text-align:center; letter-spacing:2px; outline:none; }
    .pass-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(56,189,248,0.12); }
    .btn-unlock,.btn-buy,.btn-lock-again { border:none; border-radius:12px; font-weight:800; cursor:pointer; }
    .btn-unlock { width:100%; padding:12px 14px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#062033; }
    .btn-unlock:disabled { opacity:0.6; cursor:wait; }
    .error-msg { display:none; margin-top:10px; color:var(--danger); font-size:0.8rem; font-weight:700; }
    .ok-msg { display:none; margin-top:10px; color:var(--accent); font-size:0.8rem; font-weight:700; }
    .container { max-width:1100px; margin:0 auto; display:none; }
    header { text-align:center; margin-bottom:28px; }
    .badge { display:inline-block; padding:6px 12px; border-radius:99px; background:rgba(52,211,153,0.15); color:var(--accent); font-size:0.75rem; font-weight:800; letter-spacing:0.05em; margin-bottom:10px; }
    h1 { font-size:clamp(2rem,3vw,2.7rem); font-weight:800; margin-bottom:8px; }
    header p { color:var(--muted); font-size:0.96rem; }
    .app-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:24px; }
    .app-btn { background:rgba(15,23,42,0.72); border:1px solid var(--line); border-radius:18px; padding:16px 12px; color:var(--text); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    .app-btn.active { background:rgba(56,189,248,0.08); border-color:rgba(56,189,248,0.5); }
    .app-icon { font-size:1.8rem; }
    .app-name { font-size:0.85rem; font-weight:700; text-align:center; }
    .pricing-container { background:rgba(15,23,42,0.9); border:1px solid var(--line); border-radius:24px; padding:24px; }
    .pricing-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; border-bottom:1px solid var(--line); padding-bottom:14px; flex-wrap:wrap; }
    .pricing-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:800; }
    .pricing-list { display:flex; flex-direction:column; gap:12px; }
    .price-item { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; padding:16px 18px; border-radius:16px; background:rgba(15,23,42,0.7); border:1px solid var(--line); }
    .item-info h4 { font-size:1rem; font-weight:800; margin-bottom:4px; }
    .item-info p { color:var(--muted); font-size:0.82rem; }
    .item-right { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
    .stock-badge { display:inline-block; padding:5px 9px; border-radius:8px; background:rgba(148,163,184,0.12); color:var(--muted); font-size:0.72rem; font-weight:700; }
    .item-price { font-size:1.15rem; font-weight:800; color:var(--accent); }
    .btn-buy { display:inline-flex; align-items:center; justify-content:center; padding:9px 14px; background:linear-gradient(135deg,var(--primary),var(--accent)); color:#04121e; text-decoration:none; }
    .btn-lock-again { display:block; margin:22px auto 0; padding:9px 16px; background:transparent; border:1px solid var(--line); color:var(--muted); }
  </style>
</head>
<body>
  <div class="lock-overlay" id="lockScreen">
    <div class="lock-box">
      <div class="lock-icon">
        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 style="font-size:1.35rem;font-weight:800;margin-bottom:8px;text-align:center;">Trang Web Bảo Mật</h2>
      <p style="font-size:0.88rem;color:var(--muted);text-align:center;margin-bottom:18px;">Nhập email để nhận mã truy cập mới (hiệu lực 10 phút).</p>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input id="guestEmail" class="pass-input" type="email" placeholder="Email nhận mã" style="letter-spacing:0;text-align:left;margin:0;" autocomplete="email" />
      </div>
      <button id="requestCodeBtn" type="button" class="btn-unlock" style="margin-bottom:10px;">Gửi Mã Qua Email</button>
      <form id="unlockForm">
        <input type="text" id="passInput" class="pass-input" placeholder="Nhập mã 6 số" autocomplete="off" inputmode="numeric" maxlength="6" />
        <button type="submit" class="btn-unlock" id="unlockBtn">Mở Bảng Giá</button>
        <div id="errorMsg" class="error-msg"></div>
        <div id="okMsg" class="ok-msg"></div>
      </form>
    </div>
  </div>

  <div class="container" id="mainApp">
    <header>
      <div class="badge">Bảng Giá Dịch Vụ Số Chính Chủ</div>
      <h1>Bảng Giá Dịch Vụ &amp; Tài Khoản</h1>
      <p>Bảo hành full thời hạn • Kích hoạt nhanh 5–10 phút</p>
    </header>
    <div class="app-grid" id="appGrid"></div>
    <div class="pricing-container">
      <div class="pricing-header">
        <div class="pricing-title" id="selectedAppName">Đang tải...</div>
        <span style="font-size:0.85rem;color:var(--muted);">Bảo hành 1 đổi 1</span>
      </div>
      <div class="pricing-list" id="pricingList"></div>
    </div>
    <button class="btn-lock-again" id="lockBtn">🔒 Khóa lại trang web</button>
  </div>

  <script>
    const ZALO_PHONE = '0373996379';
    let services = {};
    let currentKey = '';

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('okMsg').style.display = 'none';
    }
    function showOk(msg) {
      const el = document.getElementById('okMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    async function loadData() {
      try {
        const res = await fetch('/api/public-services', { credentials: 'same-origin', cache: 'no-store' });
        if (res.status === 401) {
          document.getElementById('lockScreen').style.display = 'flex';
          document.getElementById('mainApp').style.display = 'none';
          showError('Phiên mở khóa đã hết. Vui lòng xin mã mới.');
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        services = await res.json();
        if (!Object.keys(services).length) throw new Error('Dữ liệu đang trống.');
        currentKey = Object.keys(services)[0];
        renderAppGrid();
        renderPricing(currentKey);
      } catch (err) {
        document.getElementById('pricingList').innerHTML = `<p style="color:var(--danger);padding:20px;">Lỗi tải dữ liệu: ${esc(err.message)}</p>`;
      }
    }

    function renderAppGrid() {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';
      Object.keys(services).forEach(key => {
        const item = services[key];
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'app-btn' + (key === currentKey ? ' active' : '');
        const icon = document.createElement('span');
        icon.className = 'app-icon';
        icon.textContent = item.icon || '📦';
        const nm = document.createElement('span');
        nm.className = 'app-name';
        nm.textContent = item.name;
        b.appendChild(icon);
        b.appendChild(nm);
        b.addEventListener('click', () => selectApp(key));
        grid.appendChild(b);
      });
    }

    function selectApp(key) {
      currentKey = key;
      renderAppGrid();
      renderPricing(key);
    }

    function renderPricing(key) {
      const app = services[key];
      if (!app) return;
      document.getElementById('selectedAppName').textContent = app.name;
      const listEl = document.getElementById('pricingList');
      listEl.innerHTML = '';
      (app.plans || []).forEach(plan => {
        const row = document.createElement('div');
        row.className = 'price-item';
        const info = document.createElement('div');
        info.className = 'item-info';
        const h = document.createElement('h4');
        h.textContent = plan.name;
        const p = document.createElement('p');
        p.textContent = plan.desc || 'Bảo hành full thời hạn';
        info.appendChild(h);
        info.appendChild(p);
        const right = document.createElement('div');
        right.className = 'item-right';
        const stock = document.createElement('span');
        stock.className = 'stock-badge';
        stock.textContent = 'Còn: ' + plan.stock;
        const price = document.createElement('span');
        price.className = 'item-price';
        price.textContent = Number(plan.price || 0).toLocaleString('vi-VN') + ' đ';
        const orderMsg = encodeURIComponent(`Chào shop, mình cần mua gói: ${plan.name} (${Number(plan.price || 0).toLocaleString('vi-VN')} đ). Hướng dẫn mình nhé!`);
        const a = document.createElement('a');
        a.className = 'btn-buy';
        a.target = '_blank';
        a.rel = 'noreferrer';
        a.href = `https://zalo.me/${ZALO_PHONE}?text=${orderMsg}`;
        a.textContent = 'Đặt Mua';
        right.appendChild(stock);
        right.appendChild(price);
        right.appendChild(a);
        row.appendChild(info);
        row.appendChild(right);
        listEl.appendChild(row);
      });
    }

    document.getElementById('requestCodeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('requestCodeBtn');
      const email = document.getElementById('guestEmail').value.trim();
      if (!email || !email.includes('@')) { showError('Vui lòng nhập email hợp lệ.'); return; }
      btn.disabled = true;
      btn.textContent = 'Đang gửi...';
      try {
        const res = await fetch('/api/request-access-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email })
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok || !d.success) {
          showError(d.message || 'Không gửi được mã. Thử lại sau.');
        } else if (d.sent) {
          showOk('Đã gửi mã qua email. Kiểm tra hộp thư (cả spam) rồi nhập mã trong 10 phút.');
        } else {
          // Che do test local (chua cau hinh SMTP): server tra code truc tiep
          showOk('Chế độ test (chưa cấu hình SMTP). Mã của bạn: ' + d.code);
        }
      } catch (e) {
        showError('Không kết nối được server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gửi Mã Qua Email';
      }
    });

    document.getElementById('unlockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('unlockBtn');
      const email = document.getElementById('guestEmail').value.trim();
      const code = document.getElementById('passInput').value.trim();
      if (!email || !code) { showError('Nhập email và mã 6 số.'); return; }
      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra...';
      try {
        const res = await fetch('/api/verify-access-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, code })
        });
        const d = await res.json().catch(() => ({}));
        if (res.ok && d.success) {
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('mainApp').style.display = 'block';
          loadData();
        } else {
          showError(d.message || 'Mã không đúng. Thử lại!');
          document.getElementById('passInput').value = '';
        }
      } catch (err) {
        showError('Không kết nối được server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mở Bảng Giá';
      }
    });

    document.getElementById('lockBtn').addEventListener('click', () => window.location.reload());
  </script>
</body>
</html>
