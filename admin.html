<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Giá Dịch Vụ Số - Bản Quyền Chính Hãng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0f17;
      --card-bg: #111827;
      --card-hover: #1f2937;
      --border-color: #1f2937;
      --border-light: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --green: #10b981;
      --green-bg: #064e3b;
      --yellow: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .brand p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .brand p b { color: var(--green); }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .search-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px 10px 38px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }

    .search-box input:focus { border-color: var(--primary); }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }

    /* Main Container: 3 Cột */
    .container {
      display: grid;
      grid-template-columns: 260px 1fr 380px;
      gap: 20px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 1200px) {
      .container { grid-template-columns: 240px 1fr; }
      .col-detail { grid-column: span 2; }
    }
    @media (max-width: 768px) {
      .container { display: flex; flex-direction: column; }
    }

    /* Cột 1: Danh mục */
    .col-categories {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      height: fit-content;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .category-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .category-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      color: #cbd5e1;
      transition: all 0.2s;
    }

    .category-item:hover { background: #1e293b; color: #fff; }
    .category-item.active { background: #2563eb; color: #fff; font-weight: 600; }
    .badge-count {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
    }

    /* Cột 2: Danh sách gói */
    .col-plans {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .plans-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .plans-header h2 { font-size: 18px; font-weight: 700; }
    .plans-header span { font-size: 13px; color: var(--text-muted); }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .plan-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: var(--card-hover);
    }

    .plan-card.selected {
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px #60a5fa;
      background: #1e293b;
    }

    .plan-card h4 {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.4;
      color: #f1f5f9;
    }

    .plan-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }

    .plan-price { font-size: 16px; font-weight: 700; color: #34d399; }
    .plan-stock {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
    }

    /* Cột 3: Chi tiết mô tả */
    .col-detail {
      position: sticky;
      top: 96px;
      height: fit-content;
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .detail-empty {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .detail-name { font-size: 18px; font-weight: 700; line-height: 1.4; }

    .detail-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-tag {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .badge-tag.price { background: var(--green-bg); color: #34d399; }
    .badge-tag.stock { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    .desc-wrapper {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .desc-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #60a5fa;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .desc-box {
      background: #0b0f17;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      font-size: 13.5px;
      line-height: 1.75;
      color: #cbd5e1;
      white-space: pre-line;
      max-height: 380px;
      overflow-y: auto;
    }

    .btn-zalo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-zalo:hover { background: #0369a1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ BẢNG GIÁ DỊCH VỤ SỐ</h1>
      <p>Đặt mua qua Zalo: <b>0373 996 379</b> • Hỗ trợ 8:00 – 23:00</p>
    </div>
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Tìm gói dịch vụ (ChatGPT, YouTube, API...)" oninput="handleSearch()">
    </div>
  </header>

  <div class="container">
    <!-- Cột 1: Danh mục -->
    <div class="col-categories">
      <div class="section-title">Danh mục</div>
      <ul class="category-list" id="categoryList">
        <li style="padding: 10px; color: var(--text-muted); font-size: 13px;">Đang tải danh mục...</li>
      </ul>
    </div>

    <!-- Cột 2: Danh sách gói -->
    <div class="col-plans">
      <div class="plans-header">
        <h2 id="currentCatName">Danh sách sản phẩm</h2>
        <span id="plansCount">0 gói</span>
      </div>
      <div class="plans-grid" id="plansGrid">
        <div style="color: var(--text-muted); font-size: 14px; padding: 20px;">Đang tải danh sách gói dịch vụ...</div>
      </div>
    </div>

    <!-- Cột 3: Mô tả chi tiết -->
    <div class="col-detail">
      <div id="planDetailContainer">
        <div class="detail-empty">
          <p>Chọn một sản phẩm để xem mô tả chi tiết & đặt mua</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let servicesData = {};
    let activeCategory = '';
    let selectedPlanId = '';

    async function loadServices() {
      try {
        const res = await fetch(`data/services.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Không thể tải file services.json");
        servicesData = await res.json();
        
        const categories = Object.keys(servicesData);
        if (categories.length > 0) {
          activeCategory = categories[0];
          renderCategories();
          renderPlans();
        }
      } catch (err) {
        document.getElementById('plansGrid').innerHTML = `
          <div style="color: #ef4444; font-size: 14px; padding: 20px;">
            ⚠️ Chưa tải được dữ liệu: ${err.message}. Hãy kiểm tra lại file data/services.json!
          </div>`;
      }
    }

    function renderCategories() {
      const list = document.getElementById('categoryList');
      list.innerHTML = Object.entries(servicesData).map(([key, cat]) => `
        <li class="category-item ${key === activeCategory ? 'active' : ''}" onclick="selectCategory('${key}')">
          <span>${cat.name}</span>
          <span class="badge-count">${cat.plans.length}</span>
        </li>
      `).join('');
    }

    function selectCategory(catKey) {
      activeCategory = catKey;
      document.getElementById('searchInput').value = '';
      renderCategories();
      renderPlans();
    }

    function renderPlans(filteredPlans = null) {
      const grid = document.getElementById('plansGrid');
      const countEl = document.getElementById('plansCount');
      const catNameEl = document.getElementById('currentCatName');

      const plans = filteredPlans !== null ? filteredPlans : (servicesData[activeCategory]?.plans || []);
      
      catNameEl.innerText = filteredPlans !== null ? 'Kết quả tìm kiếm' : servicesData[activeCategory].name;
      countEl.innerText = `${plans.length} gói`;

      if (plans.length === 0) {
        grid.innerHTML = `<div style="color: var(--text-muted); font-size: 14px; padding: 20px;">Không có sản phẩm nào.</div>`;
        return;
      }

      grid.innerHTML = plans.map(p => {
        const stockText = p.stock_text || (p.stock === -1 ? 'Sẵn hàng (∞)' : (p.stock === 0 ? 'Tạm hết hàng' : `Còn ${p.stock}`));
        return `
          <div class="plan-card ${p.id === selectedPlanId ? 'selected' : ''}" onclick="selectPlan('${p.id}')">
            <h4>${p.name}</h4>
            <div class="plan-meta">
              <span class="plan-price">${Number(p.price).toLocaleString('vi-VN')}đ</span>
              <span class="plan-stock">${stockText}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectPlan(planId) {
      selectedPlanId = planId;
      renderPlans();

      let targetPlan = null;
      for (const cat of Object.values(servicesData)) {
        const found = cat.plans.find(p => p.id === planId);
        if (found) { targetPlan = found; break; }
      }

      if (!targetPlan) return;

      const container = document.getElementById('planDetailContainer');
      const stockText = targetPlan.stock_text || (targetPlan.stock === -1 ? 'Sẵn hàng (∞)' : (targetPlan.stock === 0 ? 'Tạm hết hàng' : `Còn ${targetPlan.stock}`));

      container.innerHTML = `
        <div class="detail-card">
          <div class="detail-name">${targetPlan.name}</div>

          <div class="detail-badges">
            <span class="badge-tag price">💰 ${Number(targetPlan.price).toLocaleString('vi-VN')}đ / ${targetPlan.duration || 'Gói'}</span>
            <span class="badge-tag stock">📦 ${stockText}</span>
          </div>

          <div class="desc-wrapper">
            <div class="desc-title">📄 Mô tả chi tiết</div>
            <div class="desc-box">${targetPlan.detail || 'Sản phẩm đang được cập nhật mô tả.'}</div>
          </div>

          <a href="https://zalo.me/0373996379?text=Chào bạn, mình muốn mua gói: ${encodeURIComponent(targetPlan.name)}" 
             target="_blank" 
             class="btn-zalo">
            💬 Nhắn Zalo Đặt Mua Ngay
          </a>
        </div>
      `;
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderPlans();
        return;
      }

      const matched = [];
      Object.values(servicesData).forEach(cat => {
        cat.plans.forEach(p => {
          if (p.name.toLowerCase().includes(query) || (p.detail && p.detail.toLowerCase().includes(query))) {
            matched.push(p);
          }
        });
      });

      renderPlans(matched);
    }

    document.addEventListener('DOMContentLoaded', loadServices);
  </script>
</body>
</html>
