<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: Arial, sans-serif; }
    .card { width: min(90vw, 420px); background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    input, button { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; margin-top: 12px; font-size: 1rem; box-sizing: border-box; }
    input { background: #0b1220; color: white; }
    button { background: #38bdf8; border: none; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { display: none; color: #fca5a5; margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px; text-align:center;">Admin Login</h2>
    <p style="text-align:center; color:#94a3b8; margin-bottom:16px;">Đăng nhập để quản trị dữ liệu</p>
    <form id="loginForm">
      <input id="username" type="text" placeholder="Username" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button id="loginBtn" type="submit">Đăng nhập</button>
    </form>
    <div id="error" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    // Neu da dang nhap thi vao thang admin (server se kiem tra lai)
    fetch('/api/me', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => { if (d.isAdmin) window.location.href = '/admin'; })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Đang đăng nhập...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errorBox.textContent = data.message === 'Invalid credentials'
            ? 'Sai tài khoản hoặc mật khẩu.'
            : (data.message || 'Đăng nhập thất bại. Thử lại sau.');
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Không kết nối được server.';
        errorBox.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Đăng nhập';
      }
    });
  </script>
</body>
</html>
