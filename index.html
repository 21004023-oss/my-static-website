<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng Dịch Vụ & Tài Khoản Số - phanngoquocbao.id.vn</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 30px 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
    header p { color: var(--text-muted); font-size: 1rem; }

    /* Bộ lọc phân loại */
    .filter-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .filter-btn { background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 9999px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }

    /* Lưới sản phẩm */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; position: relative; }
    .product-card:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.4); }
    .tag-category { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 6px; }
    .product-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; min-height: 38px; }
    .product-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .product-price { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .product-stock { font-size: 0.8rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px; }
    .btn-buy { width: 100%; background: var(--primary); color: #000; font-weight: 700; padding: 10px; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
    .btn-buy:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Cửa Hàng Dịch Vụ & Tài Khoản Số</h1>
      <p>Nâng cấp chính chủ • Kích hoạt nhanh 5–10 phút • Bảo hành Full hạn</p>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterCategory('all', this)">Tất Cả</button>
      <button class="filter-btn" onclick="filterCategory('AI', this)">AI & Code</button>
      <button class="filter-btn" onclick="filterCategory('Entertainment', this)">Giải Trí</button>
      <button class="filter-btn" onclick="filterCategory('Design', this)">Đồ Họa & Học Tập</button>
    </div>

    <div class="product-grid" id="productGrid">
      <!-- Dữ liệu sản phẩm hiển thị tự động -->
    </div>
  </div>

  <script>
    const CONTACT = {
      zalo: "0900000000",       // Số Zalo của bạn
      tele: "your_username"      // Username Telegram của bạn
    };

    // Dữ liệu mẫu (sẽ tự động đọc từ Admin nếu bạn sửa)
    const defaultProducts = [
      { id: 1, name: "YouTube Premium 1 Tháng", cat: "Entertainment", price: 35000, stock: 45, desc: "Chính chủ trên Gmail, chặn quảng cáo, YouTube Music." },
      { id: 2, name: "YouTube Premium 1 Năm", cat: "Entertainment", price: 360000, stock: 20, desc: "Gói 12 tháng ổn định, bảo hành trọn thời gian." },
      { id: 3, name: "ChatGPT Plus 1 Tháng", cat: "AI", price: 120000, stock: 15, desc: "Mô hình GPT-4o, Canvas, tạo ảnh DALL-E không giới hạn." },
      { id: 4, name: "Grok 30M Credit API", cat: "AI", price: 120000, stock: 30, desc: "API tốc độ cao, hỗ trợ chạy Cursor, Cline, Roo Code." },
      { id: 5, name: "CapCut Pro Cá Nhân 30 Ngày", cat: "Design", price: 45000, stock: 18, desc: "Mở full hiệu ứng Pro, xóa phông, xuất 4K mượt mà." },
      { id: 6, name: "Canva Pro 1 Năm", cat: "Design", price: 150000, stock: 50, desc: "Mở khóa toàn bộ tài nguyên thiết kế bản quyền." }
    ];

    let products = JSON.parse(localStorage.getItem('shop_products')) || defaultProducts;
    let currentCategory = 'all';

    function renderProducts(cat = 'all') {
      const grid = document.getElementById('productGrid');
      const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Hiện chưa có sản phẩm trong danh mục này.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div>
            <div class="tag-category">${p.cat}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
          </div>
          <div>
            <div class="product-meta">
              <span class="product-price">${p.price.toLocaleString('vi-VN')} đ</span>
              <span class="product-stock">Sẵn: ${p.stock}</span>
            </div>
            <button class="btn-buy" onclick="buyItem('${p.name}', ${p.price})">Đặt Mua Ngay</button>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    function buyItem(name, price) {
      const msg = `Chào bạn, mình muốn mua: ${name} (${price.toLocaleString('vi-VN')} đ). Hướng dẫn mình thanh toán nhé!`;
      const url = `https://zalo.me/${CONTACT.zalo}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
